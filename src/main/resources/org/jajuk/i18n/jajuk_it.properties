TipOfTheDay.0=\   Suggerimento 0:  puoi riascoltare il brano corrente dall'inizio con [Maiusc+clic] sul pulsante Indietro  
TipOfTheDay.1=\   Suggerimento 1:  puoi riascoltare l'album corrente dal primo brano con [CTRL+clic] sul pulsante "Brano precedente" 
TipOfTheDay.2=\   Suggerimento 2:  puoi aggiungere brani casuali alle playlist con il pulsante ? nell'editor delle playlist  
TipOfTheDay.3=\   Suggerimento 3:  puoi recuperare le copertine online anche dietro un proxy, dalla scheda Rete della vista Preferenze  
TipOfTheDay.4=\   Suggerimento 4:  Jajuk offre una barra sottile (pulsante in alto a destra del menu) per controllare la riproduzione occupando poco spazio sullo schermo  
TipOfTheDay.5=\   Suggerimento 5:  puoi nascondere i brani non disponibili selezionando l'opzione "Mostra solo i brani disponibili"  
TipOfTheDay.6=\   Suggerimento 6:  puoi eseguire quasi tutte le funzioni di Jajuk con la tastiera  
TipOfTheDay.7=\   Suggerimento 7:  puoi trascinare elementi dalle viste ad albero verso l'editor delle playlist e il repertorio delle playlist  
TipOfTheDay.8=\   Suggerimento 8:  puoi ascoltare le introduzioni dei brani con la modalità intro  
TipOfTheDay.9=\   Suggerimento 9:  puoi configurare la durata della dissolvenza incrociata nella vista Preferenze  
TipOfTheDay.10=\   Suggerimento 10:  Jajuk può fungere da sveglia avanzata grazie alla funzione Sveglia del menu Strumenti  
TipOfTheDay.12=\   Suggerimento 12:  il tema di Jajuk è configurabile nella scheda Interfaccia della vista Preferenze  
TipOfTheDay.13=\   Suggerimento 13:  puoi configurare il comportamento del doppio clic e del trascinamento (accoda e riproduci) nella scheda Opzioni della vista Preferenze  
TipOfTheDay.14=\   Suggerimento 14:  i brani "Pianificati" di Jajuk sono quelli che verranno riprodotti dopo le selezioni correnti  
TipOfTheDay.15=\   Suggerimento 15:  l'interfaccia di Jajuk è completamente ancorabile: puoi trascinare le viste per riorganizzarle  
TipOfTheDay.16=\   Suggerimento 16:  puoi conoscere il numero totale di file e brani selezionando il nodo "collezione" nelle viste ad albero File o Brani  
TipOfTheDay.17=\   Suggerimento 17:  puoi recuperare i tag online con la funzione "Recupera i tag online" sulle cartelle nelle viste ad albero File o Brani  
TipOfTheDay.18=\   Suggerimento 18:  la barra della cronologia di Jajuk (in alto al centro) mostra tutti i brani riprodotti in precedenza  
TipOfTheDay.19=\   Suggerimento 19:  puoi fare ricerche rapide con la casella di ricerca (in basso nella finestra)  
TipOfTheDay.20=\   Suggerimento 20:  puoi segnalare errori o richieste di funzionalità con l'agente qualità (Aiuto, Segnala un problema)  
TipOfTheDay.21=\   Suggerimento 21:  il DJ di Jajuk può creare playlist intelligenti seguendo le tue regole  
TipOfTheDay.22=\   Suggerimento 22:  puoi ottenere i testi dei brani con la "Vista Testi"  
TipOfTheDay.23=\   Suggerimento 23:  la vista Suggerimenti mostra informazioni LAST.FM come gli artisti simili  
TipOfTheDay.24=\   Suggerimento 24:  puoi escludere un brano che non ti piace dalla barra sottile o dal pannello di controllo  
TipOfTheDay.25=\   Suggerimento 25:  puoi mostrare o nascondere i brani non montati con un clic dal menu "Configurazione"  
TipOfTheDay.26=\   Suggerimento 26:  ora puoi scegliere la cartella dei dati di Jajuk (ad esempio un disco esterno) per conservare dati e preferenze su qualsiasi computer (vedi la scheda "Avanzate" nella vista Preferenze)  
TipOfTheDay.27=\   Suggerimento 27:  puoi aggiungere qualsiasi vista a qualsiasi prospettiva dalla barra dei menu "Viste"  
TipOfTheDay.28=\   Suggerimento 28:  puoi aprire una pagina di Wikipedia nel browser predefinito con l'icona "Apri l'indirizzo nel browser predefinito"
TipOfTheDay.29=\   Suggerimento 29:  Jajuk supporta le radio web <a href="../images/9/9d/Webradio_32x32.png" title="Image:webradio_32x32.png" class="internal"> <img src='../images/9/9d/Webradio_32x32.png' alt="Image:webradio_32x32.png"/> </a>   
TipOfTheDay.30=\   Suggerimento 30:  Jajuk può essere controllato da remoto tramite D-Bus, se disponibile sulla piattaforma (quindi non su Windows). Questo permette di usare i tasti multimediali della tastiera. Consulta il manuale online per maggiori informazioni.    
TipOfTheDay.31=\   Suggerimento 31:  prova la normalizzazione audio dalla vista Preferenze / scheda Suono per mantenere lo stesso livello sonoro tra i brani
TipOfTheDay.32=\   Suggerimento 32:  puoi esportare brani e generare playlist dalla tua collezione grazie alla funzione Prepara una festa
TipOfTheDay.33=\   Suggerimento 33:  un singolo clic sinistro sulla copertina nella vista Copertina passa dalla visualizzazione 3D a quella 2D.

