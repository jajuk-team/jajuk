#--- Tips of day ---
TipOfTheDay.0=팁 0:  컨트롤 패널이나 트레이에서 Rewind 버튼 위에 [Shift+click]을 누름으로써 현재 트랙을 처음부터 다시 재생할 수 있다 ?
TipOfTheDay.1=팁 1:  컨트롤 패널이나 트레이에서 Previous 버튼 위에 [Shift+click]을 누름으로써 앨범의 첫 번째 트랙부터 다시 재생할 수 있다 ?
TipOfTheDay.2=팁 2:  재생목록 에디터의 ? 버튼을 누름으로써 재생목록의 무작위 아이템을 추가할 수 있다 ? 
TipOfTheDay.3=팁 3:  Parameter 뷰의 네트웍 탭을 사용하는 공용 proxy 서버 뒤에서 일지라도 온라인 상에서 커버 이미지를 얻을 수 있다 ? 
TipOfTheDay.4=팁 4:  Parameter 뷰의 커버 탭에서 '커버 이미지 미리 적재(prefetch covers) 옵션을 선택하면, 커버 뷰의 네비게이션 기능을 빠르게 하기 위해 온라인 상에서 발견한 모든 커버 이미지들을 저장할 수 있다 ? 
TipOfTheDay.5=팁 5:  Parameter 뷰 / 옵션 탭의 '마운트된 장치만 보여주기' 옵션을 사용하면 사용가능하지 않은 트랙을 숨길 수 있다 ?
TipOfTheDay.6=팁 6:  키보드만을 사용해도 jajuk의 대부분의 기능들을 다룰 수 있다 ?
TipOfTheDay.7=팁 7:  재생목록 에디터와 재생목록 저장소 (Playlist repository)에서의 free 뷰로부터 재생목록까지 언제나 아이템들을 드래그&드랍할 수 있다 ?
TipOfTheDay.8=팁 8:  인터로 모드를 사용하면 트랙의 일정 앞부분을 청취할 수 있다 ?
TipOfTheDay.9=팁 9:  Parameter 뷰 / 옵션 탭에서 크로스-페이드 간격을 설정할 수 있다 ?
TipOfTheDay.10=팁 10:  트레이 팝업내의 윈도우 시작시 jajuk 보이기 옵션을 해제함으로써 jajuk을 reduced mode로 시작할 수 있다 ?
TipOfTheDay.12=팁 12:  Jajuk의 룩&필(Look and Feel)은 Parameter 뷰 / 옵션 탭에서 설정 가능하다 ?
TipOfTheDay.13=팁 13:  더블클릭과 드래그&드랍 (push & play) 기능을 Parameter 뷰 / 옵션 탭에서 설정 가능하다 ?
TipOfTheDay.14=팁 14:  Jajuk의 '예정된' 트랙들은 현재 유저에 의해 선택된 트랙들이 모두 재생된 후에 재생될 트랙들이다 ?
TipOfTheDay.15=팁 15:  Jajuk의 그래픽 인터페이스는 완벽히 조작 가능하고 드래그&드랍 기능을 사용하여 뷰들을 재배치할 수 있다 ?
TipOfTheDay.16=팁 16:  물리적 / 논리적 트리 뷰의 '컬렉션' 노드를 선택함으로써 파일과 트랙의 총 개수를 알 수 있다 ? 
TipOfTheDay.17=팁 17:  물리적 트리 뷰의 디렉토리에 대한 '온라인에서 태그 수집' 기능을 통해 태그 정보를 얻을 수 있다 ?
TipOfTheDay.18=팁 18:  Jajuk 윈도우의 윗 부분에 있는 재생 기록 막대(history bar)에서 이전에 재생된 모든 트랙 목록들을 볼 수 있다 ?
TipOfTheDay.19=팁 19:  Jajuk 윈도우의 윗 부분에 있는 Search box를 이용하여 빠른 검색을 수행할 수 있다 ? 
TipOfTheDay.20=팁 20:  품질 에이전트로 버그나 기능 요청을 보고할 수 있습니다 (도움말, 문제 보고)  
TipOfTheDay.21=팁 21:  Jajuk DJ는 사용자가 정한 규칙에 따라 지능적인 재생 목록을 만들 수 있습니다  
TipOfTheDay.22=팁 22:  "가사 보기"로 트랙의 가사를 볼 수 있습니다  
TipOfTheDay.23=팁 23:  추천 보기는 비슷한 아티스트 같은 LAST.FM 정보를 표시합니다  
TipOfTheDay.24=팁 24:  마음에 들지 않는 트랙은 슬림바나 제어판에서 차단할 수 있습니다  
TipOfTheDay.25=팁 25:  "설정" 메뉴 막대에서 클릭 한 번으로 마운트되지 않은 트랙을 표시하거나 숨길 수 있습니다  
TipOfTheDay.26=팁 26:  이제 Jajuk 데이터를 저장할 디렉터리 (예: 외장 디스크) 를 선택해, 어느 컴퓨터에서나 데이터와 설정을 유지할 수 있습니다 (환경설정 보기의 "고급" 탭 참조)  
TipOfTheDay.27=팁 27:  "보기" 메뉴 막대로 어떤 퍼스펙티브에도 원하는 보기를 추가할 수 있습니다  
TipOfTheDay.28=팁 28:  "기본 브라우저로 주소 열기" 아이콘으로 위키백과 페이지를 기본 브라우저에서 열 수 있습니다
TipOfTheDay.29=팁 29:  Jajuk은 웹 라디오를 지원합니다 <a href="../images/9/9d/Webradio_32x32.png" title="Image:webradio_32x32.png" class="internal"> <img src='../images/9/9d/Webradio_32x32.png' alt="Image:webradio_32x32.png"/> </a>   
TipOfTheDay.30=팁 30:  현재 플랫폼에서 D-Bus를 사용할 수 있으면 (즉 Windows가 아니면) Jajuk을 원격으로 제어할 수 있습니다. 키보드의 멀티미디어 키로 Jajuk을 조작할 수 있습니다. 자세한 내용은 온라인 설명서를 참고하십시오.    
TipOfTheDay.31=팁 31:  환경설정 보기 / 소리 탭의 오디오 정규화를 사용해 트랙 간 음량을 고르게 유지해 보십시오
TipOfTheDay.32=팁 32:  파티 준비 기능으로 컬렉션에서 트랙을 내보내고 재생 목록을 만들 수 있습니다
TipOfTheDay.33=팁 33:  표지 보기에서 표지 그림을 한 번 왼쪽 클릭하면 3D와 2D 표시가 전환됩니다.
