#--- Tips of day ---
TipOfTheDay.0=Tip 0:  Dat je het huidig nummer opnieuw kunt afspelen vanaf het begin met [Shift+klik] op de "terugspoel" knop in het controle paneel of het icoon in het systeemvak ?
TipOfTheDay.1=Tip 1:  Dat je het huidig album vanaf het eerste nummer opnieuw kan spelen met [Shift+click] op de "vorig nummer" knop in het controle paneel of het icoon in het systeemvak ?
TipOfTheDay.2=Tip 2:  Dat je willekeurige nummers kan toevoegen aan de afspeel lijst door de "?" knop te gebruiken in de afspeellijst bewerker ?
TipOfTheDay.3=Tip 3:  Dat je omslagen vanaf het internet kan halen, zelfs achter een bedrijfs-proxy door dit in te stellen in de "Netwerk" tab in het Parameter beeld ?
TipOfTheDay.4=Tip 4:  Dat je alle gevonden omslagen kan bufferen om de navigatie in het omslag beeld te versnellen met de Vooraf laden optie in de "Omslag" tab in het Parameter beeld ?
TipOfTheDay.5=Tip 5:  Dat je onbeschikbare nummers kan verstoppen via de "Laat alleen verbonden apparaten zien"  optie in parameter beeld / opties tab ?
TipOfTheDay.6=Tip 6:  Dat je bijna alle functies ook kunt uitvoeren met het toetsenbord ?
TipOfTheDay.7=Tip 7:  Dat je items kan slepen van de boom structuur naar de afspeellijsten in de bewerker en repository ?
TipOfTheDay.8=Tip 8:  Dat je naar de inleiding van nummer kan luisteren met behulp van de intro mode ?
TipOfTheDay.9=Tip 9:  Dat je de cross-fade duur kan instellen in Parameter beeld / Opties tab ?
TipOfTheDay.10=Tip 10:  Dat je Jajuk geminimalizeerd kan opstarten door de "Maak Jajuk zichtbaar bij opstarten" optie uit te vinken in het systemvak icoon menu ?
TipOfTheDay.12=Tip 12:  Dat het uiterlijk en gedrag van Jajuk in te stellen is het in Parameter beeld / Opties tab ?
TipOfTheDay.13=Tip 13:  Dat je het gedrag van dubbel klik en slepen (push of afspelen) kan instellen in het Parameter beeld / Opties tab ?
TipOfTheDay.14=Tip 14:  Dat "geplande" tracks afgespeeld worden na het afspelen van de huidige selectie ?
TipOfTheDay.15=Tip 15:  Dat de grafische interface volledig "dockable" is en dat je de verschillende "views" kan verplaatsen door ze te verslepen ?
TipOfTheDay.16=Tip 16:  Dat je het totale aantal bestanden en nummers kan zien via "collectie" node in de fysieke of logische boom structuur te selecteren ?
TipOfTheDay.17=Tip 17:  Dat je labels van het internet kan laden met de "Zoek labels online" functie op mappen in de fysieke boom structuur ?
TipOfTheDay.18=Tip 18:  Dat de Jajuk geschiedenis balk (boven aan het venster) alle gespeelde nummers bevat ?
TipOfTheDay.19=Tip 19:  Dat je kan snelzoeken met het Zoek veld (boven aan het venster) ?
TipOfTheDay.20=Tip 20:  je kunt fouten of wensen melden met de kwaliteitsagent (Help, Een probleem melden)  
TipOfTheDay.21=Tip 21:  de DJ van Jajuk kan intelligente afspeellijsten maken volgens jouw regels  
TipOfTheDay.22=Tip 22:  je kunt songteksten van tracks ophalen via de "Songtekstweergave"  
TipOfTheDay.23=Tip 23:  de weergave Suggesties toont LAST.FM-informatie zoals vergelijkbare artiesten  
TipOfTheDay.24=Tip 24:  je kunt een track die je niet bevalt blokkeren vanaf de slanke balk of het bedieningspaneel  
TipOfTheDay.25=Tip 25:  je kunt niet-aangekoppelde tracks met één klik tonen of verbergen via het menu "Configuratie"  
TipOfTheDay.26=Tip 26:  je kunt nu een map voor de gegevens van Jajuk kiezen (bijvoorbeeld een externe schijf) om je gegevens en voorkeuren op elke computer te behouden (zie het tabblad "Geavanceerd" in de weergave Voorkeuren)  
TipOfTheDay.27=Tip 27:  je kunt elke weergave aan elk perspectief toevoegen via de menubalk "Weergaven"  
TipOfTheDay.28=Tip 28:  je kunt een Wikipedia-pagina in je standaardbrowser openen met het pictogram "Adres openen in de standaardbrowser"
TipOfTheDay.29=Tip 29:  Jajuk ondersteunt webradio's <a href="../images/9/9d/Webradio_32x32.png" title="Image:webradio_32x32.png" class="internal"> <img src='../images/9/9d/Webradio_32x32.png' alt="Image:webradio_32x32.png"/> </a>   
TipOfTheDay.30=Tip 30:  Jajuk kan op afstand worden bediend via D-Bus, als dat op het platform beschikbaar is (dus niet op Windows). Zo kun je de multimediatoetsen van je toetsenbord gebruiken. Zie de online handleiding voor meer informatie.    
TipOfTheDay.31=Tip 31:  probeer de audionormalisatie via Voorkeuren / tabblad Geluid om het geluidsniveau tussen tracks gelijk te houden
TipOfTheDay.32=Tip 32:  je kunt tracks exporteren en afspeellijsten genereren uit je collectie met de functie Feest voorbereiden
TipOfTheDay.33=Tip 33:  één linkerklik op de hoesafbeelding in de weergave Hoes schakelt tussen 3D- en 2D-weergave.
