TipOfTheDay.0=\   Tips 0:  du kan spela om det aktuella spåret från början med [Skift+klick] på bakåtknappen  
TipOfTheDay.1=\   Tips 1:  du kan spela om det aktuella albumet från första spåret med [CTRL+klick] på knappen "Föregående spår" 
TipOfTheDay.2=\   Tips 2:  du kan lägga till slumpmässiga objekt i spellistor med ?-knappen i spellisteredigeraren  
TipOfTheDay.3=\   Tips 3:  du kan hämta omslag online även bakom en proxyserver via fliken Nätverk i vyn Inställningar  
TipOfTheDay.4=\   Tips 4:  Jajuk har ett smalt fält (knappen uppe till höger i menyn) för att styra uppspelningen med minimal skärmyta  
TipOfTheDay.5=\   Tips 5:  du kan dölja otillgängliga spår genom att välja alternativet "Visa endast tillgängliga spår"  
TipOfTheDay.6=\   Tips 6:  du kan utföra nästan alla Jajuk-funktioner med tangentbordet  
TipOfTheDay.7=\   Tips 7:  du kan dra och släppa objekt från trädvyerna till spellisteredigeraren och spellisteförrådet  
TipOfTheDay.8=\   Tips 8:  du kan lyssna på spårens introduktioner med intro-läget  
TipOfTheDay.9=\   Tips 9:  du kan ställa in övertoningens längd i vyn Inställningar  
TipOfTheDay.10=\   Tips 10:  Jajuk kan användas som en avancerad väckarklocka via alarmfunktionen i verktygsmenyn  
TipOfTheDay.12=\   Tips 12:  Jajuks tema kan ställas in på fliken Gränssnitt i vyn Inställningar  
TipOfTheDay.13=\   Tips 13:  du kan ställa in beteendet för dubbelklick och dra och släpp (köa och spela) på fliken Alternativ i vyn Inställningar  
TipOfTheDay.14=\   Tips 14:  Jajuks "planerade" spår är de som spelas efter de aktuella spårvalen  
TipOfTheDay.15=\   Tips 15:  Jajuks grafiska gränssnitt är helt dockningsbart och du kan dra vyerna för att omorganisera dem  
TipOfTheDay.16=\   Tips 16:  du kan se totalt antal filer och spår genom att välja noden "samling" i träd­vyerna Filer eller Spår  
TipOfTheDay.17=\   Tips 17:  du kan hämta taggar online med funktionen "Hämta taggar online" på kataloger i trädvyerna Filer eller Spår  
TipOfTheDay.18=\   Tips 18:  Jajuks historikfält (överst i mitten av fönstret) visar alla tidigare spelade spår  
TipOfTheDay.19=\   Tips 19:  du kan göra snabbsökningar med sökrutan (nederst i fönstret)  
TipOfTheDay.20=\   Tips 20:  du kan rapportera fel eller önskemål med kvalitetsagenten (Hjälp, Rapportera ett ärende)  
TipOfTheDay.21=\   Tips 21:  Jajuks DJ kan skapa intelligenta spellistor enligt dina regler  
TipOfTheDay.22=\   Tips 22:  du kan hämta låttexter via "Låttextvyn"  
TipOfTheDay.23=\   Tips 23:  förslagsvyn visar LAST.FM-information som liknande artister  
TipOfTheDay.24=\   Tips 24:  du kan blockera ett spår du inte gillar från det smala fältet eller kontrollpanelen  
TipOfTheDay.25=\   Tips 25:  du kan visa/dölja omonterade spår med ett klick i menyn "Konfiguration"  
TipOfTheDay.26=\   Tips 26:  du kan nu välja katalog för Jajuks data (t.ex. en extern disk) för att behålla dina data och inställningar på vilken dator som helst (se fliken "Avancerat" i vyn Inställningar)  
TipOfTheDay.27=\   Tips 27:  du kan lägga till vilken vy som helst i vilket perspektiv som helst via menyn "Vyer"  
TipOfTheDay.28=\   Tips 28:  du kan öppna en Wikipedia-sida i din standardwebbläsare med ikonen "Öppna adressen i standardwebbläsaren"
TipOfTheDay.29=\   Tips 29:  Jajuk stöder webbradio <a href="../images/9/9d/Webradio_32x32.png" title="Image:webradio_32x32.png" class="internal"> <img src='../images/9/9d/Webradio_32x32.png' alt="Image:webradio_32x32.png"/> </a>   
TipOfTheDay.30=\   Tips 30:  Jajuk kan fjärrstyras via D-Bus om det finns på plattformen (alltså inte på Windows). Det gör att du kan använda tangentbordets multimedietangenter. Se onlinemanualen för mer information.    
TipOfTheDay.31=\   Tips 31:  prova ljudnormaliseringen i vyn Inställningar / fliken Ljud för att hålla ljudnivån jämn mellan spåren
TipOfTheDay.32=\   Tips 32:  du kan exportera spår och skapa spellistor ur din samling tack vare funktionen Förbered fest
TipOfTheDay.33=\   Tips 33:  ett enkelt vänsterklick på omslagsbilden i omslagsvyn växlar mellan 3D- och 2D-visning.
